<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d1fae5" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>

  <!-- Subtle inner highlight -->
  <rect x="10" y="10" width="180" height="90" rx="38" fill="white" fill-opacity="0.06"/>

  <!-- Upward arrow / growth shape (emerald white) -->
  <!-- Arrow shaft -->
  <rect x="91" y="72" width="18" height="60" rx="9" fill="url(#arrowGrad)"/>
  <!-- Arrow head (pointing up) -->
  <polygon points="100,38 128,78 72,78" fill="url(#arrowGrad)"/>

  <!-- Open book icon in amber at bottom -->
  <g transform="translate(68, 126)">
    <!-- Left page -->
    <path d="M2 8 Q2 2 8 2 L32 6 L32 42 L8 38 Q2 38 2 32 Z" fill="url(#bookGrad)" opacity="0.95"/>
    <!-- Right page -->
    <path d="M62 8 Q62 2 56 2 L32 6 L32 42 L56 38 Q62 38 62 32 Z" fill="url(#bookGrad)" opacity="0.85"/>
    <!-- Spine -->
    <rect x="30" y="6" width="4" height="36" rx="2" fill="#92400e" opacity="0.5"/>
    <!-- Lines on left page -->
    <line x1="10" y1="16" x2="28" y2="17" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="10" y1="23" x2="28" y2="24" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="10" y1="30" x2="22" y2="31" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Lines on right page -->
    <line x1="36" y1="17" x2="54" y2="16" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="36" y1="24" x2="54" y2="23" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="36" y1="31" x2="48" y2="30" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
